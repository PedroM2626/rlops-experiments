services:
  # ---- Chase: single-humanoid evasion ----
  chase-trainer:
    build:
      context: ./Chase
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./Chase/models:/app/models
      - ./Chase/mlruns:/app/mlruns
    command: python train.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chase-mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./Chase/mlruns:/app/mlruns
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns"

  # ---- Parkour: procedural platform navigation ----
  parkour-trainer:
    build: .
    volumes:
      - ./Parkour-Obstacles/models:/app/Parkour-Obstacles/models
      - ./Parkour-Obstacles/mlruns:/app/Parkour-Obstacles/mlruns
    env_file:
      - .env
    working_dir: /app/Parkour-Obstacles
    command: python -m src.train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  parkour-mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./Parkour-Obstacles/mlruns:/app/mlruns
    ports:
      - "5003:5003"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5003 --backend-store-uri /app/mlruns"

  # ---- Race: Competitive Multi-Agent Humanoid Walking Race ----
  race-trainer:
    build:
      context: ./Race
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./Race/models:/app/models
      - ./Race/mlruns:/app/mlruns
    env_file:
      - ./Race/.env
    command: python -m src.train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  race-mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./Race/mlruns:/app/mlruns
    ports:
      - "5001:5001"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5001 --backend-store-uri /app/mlruns"

  # ---- PPO Implementation Comparison ----
  ppo-comparison:
    build:
      context: ./PPO-Comparison
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./PPO-Comparison/results:/app/results
      - ./PPO-Comparison/mlruns:/app/mlruns
    command: python run_all.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ppo-comparison-mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./PPO-Comparison/mlruns:/app/mlruns
    ports:
      - "5002:5000"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns"
