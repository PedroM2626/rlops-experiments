version: "3.9"

services:
  trainer:
    build: .
    volumes:
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    env_file:
      - .env
    command: python src/train.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mlflow-ui:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./mlruns:/app/mlruns
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns"

  # ---- Race: Competitive Multi-Agent Humanoid Walking Race ----
  race-trainer:
    build:
      context: ./Race
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./Race/models:/app/models
      - ./Race/mlruns:/app/mlruns
    env_file:
      - ./Race/.env.example
    command: python -m src.train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  race-mlflow:
    image: python:3.10-slim
    working_dir: /app
    volumes:
      - ./Race/mlruns:/app/mlruns
    ports:
      - "5001:5001"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5001 --backend-store-uri /app/mlruns"

  # ---- PPO Implementation Comparison ----
  ppo-comparison:
    build:
      context: ./PPO-Comparison
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./PPO-Comparison/results:/app/results
      - ./PPO-Comparison/mlruns:/app/mlruns
    command: python run_all.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ppo-comparison-mlflow:
    image: python:3.14-slim
    working_dir: /app
    volumes:
      - ./PPO-Comparison/mlruns:/app/mlruns
    ports:
      - "5002:5000"
    command: >
      sh -c "pip install --quiet mlflow &&
             mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /app/mlruns"
